[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisgnn"
version = "0.1.0"
description = "Tipping points in Antarctic ice-shelf basal melt: box models and graph neural network emulators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Masoud Rostami", email = "rostami@pik-potsdam.de" }]
keywords = ["antarctica", "ice shelf", "basal melt", "tipping points",
            "bifurcation", "graph neural network", "ocean modelling"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "xarray>=2023.12",
    "netCDF4",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
gnn = ["torch>=2.2", "torch-geometric>=2.5", "shap>=0.44", "captum>=0.7", "umap-learn>=0.5"]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.setuptools.packages.find]
include = ["aisgnn*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
