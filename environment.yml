name: aisgnn
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # --- numerics -----------------------------------------------------------
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.1
  - scikit-learn>=1.3
  # --- geoscience I/O ------------------------------------------------------
  - xarray>=2023.12
  - netcdf4
  - h5netcdf
  - dask
  - zarr
  - bottleneck
  - pyproj
  - cartopy
  # --- plotting -----------------------------------------------------------
  - matplotlib>=3.8
  - seaborn
  # --- tooling ------------------------------------------------------------
  - pytest
  - ruff
  - tqdm
  - pyyaml
  - pip:
      # Torch and PyTorch Geometric come from pip rather than conda so that the
      # CUDA build is pinned explicitly and the two stay version-matched; the
      # conda pytorch channel routinely lags and silently resolves to a CPU
      # build, which fails only once a job reaches a GPU node.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.1
      - torch-geometric>=2.5
      - shap>=0.44
      - captum>=0.7
      - umap-learn>=0.5
